<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douyin Link Cleaner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
:root {
  --bg:#f4f5f7; --card:#fff; --field:#f9fafb; --border:#d9dce1; --text:#16181d; --muted:#6b7280;
  --cyan:#25f4ee; --pink:#fe2c55; --ok:#15803d; --err:#dc2626; --btn2:#e5e7eb; --btn2-h:#d5d8de;
  --done:#ecfdf3;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0e0e10; --card:#17171a; --field:#1c1c1f; --border:#2e2e33; --text:#f3f4f6; --muted:#9ca3af;
    --ok:#4ade80; --err:#ff6b81; --btn2:#2a2a2e; --btn2-h:#3a3a40; --done:#12261a; }
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body { background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center;
  min-height:100vh; min-height:100dvh; padding:20px 14px;
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
.app { width:100%; max-width:680px; background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:20px; display:flex; flex-direction:column; gap:10px; flex:none; }
/* Đẩy khung lên cao: khoảng trống chia 30% phía trên / 70% phía dưới (đổi 3 và 7 để chỉnh) */
body::before { content:""; flex:3 1 0; }
body::after { content:""; flex:7 1 0; }
header { display:flex; align-items:center; gap:12px; margin-bottom:4px; }
.logo { width:42px; height:42px; border-radius:10px; display:grid; place-items:center; font-size:22px; font-weight:700;
  color:#fff; background:linear-gradient(135deg,var(--cyan),var(--pink)); }
h1 { margin:0; font-size:1.25rem; } .sub { font-size:.8rem; color:var(--muted); }
label,.lbl { font-size:.72rem; font-weight:600; letter-spacing:.04em; color:var(--muted); margin-top:4px; }
textarea { width:100%; min-height:150px; resize:vertical; background:var(--field); color:var(--text);
  border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; font-size:.95rem; }
textarea:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 2px color-mix(in srgb,var(--cyan) 35%,transparent); }
.btns { display:flex; gap:10px; margin:4px 0; }
button { flex:1; border:0; border-radius:8px; padding:12px 8px; font:inherit; font-weight:700; font-size:.85rem;
  cursor:pointer; color:var(--text); background:var(--btn2); transition:background .15s,transform .05s; }
button:hover { background:var(--btn2-h); } button:active { transform:scale(.98); }
#btnPaste { background:#0e9f98; color:#fff; } #btnPaste:hover { background:#12b8b0; }
#btnExtract { background:var(--pink); color:#fff; } #btnExtract:hover { background:#ff4d70; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.bar button { flex:0 1 auto; padding:8px 12px; font-size:.78rem; }
.bar label { margin:0 0 0 auto; display:flex; gap:6px; align-items:center; cursor:pointer; letter-spacing:0; font-weight:500; }
#list { display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto; }
.row { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; background:var(--field);
  border:1px solid var(--border); border-left:4px solid var(--pink); border-radius:8px; padding:8px 10px; }
.row.done { background:var(--done); border-left-color:var(--ok); }
.num { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:.78rem; font-weight:700;
  color:#fff; background:linear-gradient(135deg,var(--cyan),var(--pink)); }
.info { min-width:0; }
.ttl { font-size:.88rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.url { font-family:Consolas,"Courier New",monospace; font-size:.78rem; color:var(--muted); word-break:break-all; user-select:all; }
.tag { font-size:.65rem; font-weight:700; color:#fff; background:var(--err); border-radius:4px; padding:1px 5px; margin-left:6px; }
.row button { padding:8px 12px; font-size:.75rem; flex:none; min-width:118px; }
button.done { background:#16a34a; color:#fff; } button.done:hover { background:#15803d; }
#status { min-height:1.2em; font-size:.8rem; color:var(--muted); }
#status.ok { color:var(--ok); } #status.err { color:var(--err); }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="logo" aria-hidden="true">♪</div>
    <div><h1>Douyin Link Cleaner</h1><div class="sub">Làm sạch hàng loạt đường dẫn chia sẻ Douyin</div></div>
  </header>

  <label for="input">NỘI DUNG CHIA SẺ (có thể dán nhiều link cùng lúc)</label>
  <textarea id="input" placeholder="Dán nội dung chia sẻ Douyin vào đây..." spellcheck="false"></textarea>

  <div class="btns">
    <button id="btnPaste" type="button">PASTE</button>
    <button id="btnExtract" type="button" title="Ctrl + Enter">LẤY LINK</button>
    <button id="btnReset" type="button">RESET</button>
  </div>

  <div class="lbl" id="count">LINK ĐÃ LÀM SẠCH</div>
  <div class="bar" id="bar" hidden>
    <button id="btnCopyAll" type="button">COPY TẤT CẢ</button>
    <button id="btnCopyTitle" type="button" title="STT, tiêu đề, link cách nhau bằng Tab - dán thẳng vào Excel/Google Sheets">COPY KÈM TIÊU ĐỀ</button>
    <label><input type="checkbox" id="dedupe" checked> Bỏ link trùng</label>
  </div>
  <div id="list"></div>
  <div id="status" role="status" aria-live="polite">Sẵn sàng.</div>
</main>

<script>
/*LOGIC*/
var DOUYIN_RE = /https?:\/\/(?:v\.douyin\.com\/[A-Za-z0-9_-]+\/?|(?:www\.)?douyin\.com\/(?:video|note)\/[A-Za-z0-9_-]+)/ig;

function shortId(url) { return url.replace(/\/+$/, "").split("/").pop(); }

// Lấy tiêu đề từ đoạn chữ đứng ngay trước link (best-effort).
function cleanTitle(s) {
  s = s.replace(/^\s*\d+(?:\.\d+)?\s+/, "");                                  // "0.28 "
  s = s.replace(/^\d{1,2}\/\d{1,2}\s+(?:\S+\s+){0,2}?\S*:\/\s*/, "");        // "11/18 D@o.Cn bpr:/ "
  s = s.split(/[#＃]/)[0];                                                    // bỏ hashtag
  return s.replace(/\s+/g, " ").trim();
}

function titleFromGap(gap, isFirst) {
  if (!isFirst) {
    var lines = gap.split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (/\n/.test(gap) && lines.length > 1) gap = lines[lines.length - 1];     // mỗi lượt chia sẻ 1 dòng
    else {                                                                       // tất cả trên 1 dòng: cắt phần đuôi của link trước
      gap = gap.replace(/^[\s\S]*视频[！!]/, "");
      gap = gap.replace(/^\s*\d{1,2}\/\d{1,2}\s+\S+\s+\S+\s+:\S+/, "");
    }
  }
  return cleanTitle(gap);
}

// Trả về mảng {n, url, id, title, dupOf} theo đúng thứ tự xuất hiện trong nội dung dán.
function extractAll(text, dedupe) {
  var re = new RegExp(DOUYIN_RE.source, "ig"), m, prevEnd = 0, out = [], seen = {}, removed = 0, i = 0;
  while ((m = re.exec(text || "")) !== null) {
    var url = m[0], title = titleFromGap(text.slice(prevEnd, m.index), i === 0);
    prevEnd = m.index + url.length; i++;
    var key = url.toLowerCase();
    if (seen[key]) { if (dedupe) { removed++; continue; } }
    var item = { url: url, id: shortId(url), title: title, dupOf: seen[key] || 0 };
    out.push(item); item.n = out.length;
    if (!seen[key]) seen[key] = item.n;
  }
  return { items: out, removed: removed };
}
/*END LOGIC*/

(function () {
  var $in = document.getElementById("input"), $list = document.getElementById("list"),
      $st = document.getElementById("status"), $bar = document.getElementById("bar"),
      $count = document.getElementById("count"), $dd = document.getElementById("dedupe");
  var items = [], timer = null;

  function setStatus(msg, kind) {
    $st.textContent = msg; $st.className = kind || ""; clearTimeout(timer);
    if (kind) timer = setTimeout(function () { $st.textContent = "Sẵn sàng."; $st.className = ""; }, 4000);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); var ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta); return ok;
    }
  }

  var DONE = "✓ ĐÃ LẤY LINK", $all = document.getElementById("btnCopyAll"), $ttl = document.getElementById("btnCopyTitle");
  function markDone(it) { it.row.classList.add("done"); it.btn.classList.add("done"); it.btn.textContent = DONE; }
  function markAll(btn) { items.forEach(markDone); btn.classList.add("done"); btn.textContent = DONE; }

  function render() {
    $list.textContent = "";
    $all.classList.remove("done"); $all.textContent = "COPY TẤT CẢ";
    $ttl.classList.remove("done"); $ttl.textContent = "COPY KÈM TIÊU ĐỀ";
    $bar.hidden = items.length === 0;
    $count.textContent = items.length ? "LINK ĐÃ LÀM SẠCH (" + items.length + ")" : "LINK ĐÃ LÀM SẠCH";
    items.forEach(function (it) {
      var row = document.createElement("div"); row.className = "row"; it.row = row;
      var num = document.createElement("div"); num.className = "num"; num.textContent = it.n;
      var info = document.createElement("div"); info.className = "info";
      var t = document.createElement("div"); t.className = "ttl";
      t.textContent = it.title || "(không có tiêu đề) · " + it.id; t.title = t.textContent;
      if (it.dupOf) { var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "TRÙNG #" + it.dupOf; t.appendChild(tag); }
      var u = document.createElement("div"); u.className = "url"; u.textContent = it.url;
      info.appendChild(t); info.appendChild(u);
      var b = document.createElement("button"); b.type = "button"; b.textContent = "COPY LINK"; it.btn = b;
      b.addEventListener("click", async function () {
        if (await copyText(it.url)) { markDone(it); setStatus("Đã lấy link #" + it.n + ".", "ok"); }
        else setStatus("Không copy được, hãy bôi đen link và copy thủ công.", "err");
      });
      row.appendChild(num); row.appendChild(info); row.appendChild(b); $list.appendChild(row);
    });
  }

  function extract() {
    var r = extractAll($in.value, $dd.checked); items = r.items; render();
    if (!items.length) { setStatus("Không tìm thấy link Douyin hợp lệ!", "err"); return; }
    setStatus("Đã lấy " + items.length + " link" + (r.removed ? " (bỏ " + r.removed + " link trùng)" : "") + ".", "ok");
  }

  document.getElementById("btnExtract").addEventListener("click", extract);
  $dd.addEventListener("change", function () { if (items.length) extract(); });
  $in.addEventListener("keydown", function (e) { if (e.ctrlKey && e.key === "Enter") extract(); });

  document.getElementById("btnPaste").addEventListener("click", async function () {
    try {
      if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error("unsupported");
      var text = await navigator.clipboard.readText();
      if (!text || !text.trim()) { setStatus("Clipboard trống hoặc không có văn bản!", "err"); return; }
      $in.value = text; setStatus("Đã dán nội dung từ Clipboard.", "ok");
    } catch (e) { $in.focus(); setStatus("Trình duyệt không cho đọc Clipboard. Hãy cho phép quyền, hoặc nhấn giữ/Ctrl+V vào ô nhập.", "err"); }
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    $in.value = ""; items = []; render(); $in.focus(); setStatus("Đã reset.", "ok");
  });

  document.getElementById("btnCopyAll").addEventListener("click", async function () {
    var ok = await copyText(items.map(function (i) { return i.url; }).join("\n"));
    if (ok) markAll($all);
    setStatus(ok ? "Đã lấy " + items.length + " link (mỗi link một dòng)." : "Không copy được.", ok ? "ok" : "err");
  });

  document.getElementById("btnCopyTitle").addEventListener("click", async function () {
    var ok = await copyText(items.map(function (i) { return i.n + "\t" + (i.title || i.id) + "\t" + i.url; }).join("\n"));
    if (ok) markAll($ttl);
    setStatus(ok ? "Đã lấy " + items.length + " dòng: STT, tiêu đề, link (dán vào Excel/Sheets)." : "Không copy được.", ok ? "ok" : "err");
  });
})();
</script>
</body>
</html>
